name: Build Tic Tac Toe APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tic-tac-toe-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"
  APP_DIR: generated_app

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          set -euo pipefail

          flutter config --no-analytics

          flutter create "$APP_DIR" \
            --platforms=android \
            --org cok.aokjfjigg.tic \
            --project-name tic_tac_toe \
            --android-language kotlin \
            --empty

      - name: Write dependencies
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          cat > pubspec.yaml <<'EOF'
          name: tic_tac_toe
          description: A polished offline Tic Tac Toe game.
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.7.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            audioplayers: 6.4.0
            shared_preferences: 2.5.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: 5.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/tap.wav
              - assets/win.wav
              - assets/draw.wav
          EOF

          cat > analysis_options.yaml <<'EOF'
          include: package:flutter_lints/flutter.yaml
          EOF

      - name: Generate sounds and launcher icons
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          python3 <<'PY'
          import math
          import pathlib
          import struct
          import wave
          import zlib

          assets = pathlib.Path("assets")
          assets.mkdir(exist_ok=True)

          def make_sound(name, notes, duration):
              rate = 44100
              frames = bytearray()
              for frequency in notes:
                  count = int(rate * duration)
                  for i in range(count):
                      t = i / rate
                      envelope = min(1.0, i / (rate * 0.006))
                      envelope *= max(0.0, 1.0 - i / count) ** 1.5
                      value = int(
                          13000 * envelope *
                          math.sin(2 * math.pi * frequency * t)
                      )
                      frames.extend(struct.pack("<h", value))
              with wave.open(str(assets / name), "wb") as output:
                  output.setnchannels(1)
                  output.setsampwidth(2)
                  output.setframerate(rate)
                  output.writeframes(frames)

          make_sound("tap.wav", [660], 0.075)
          make_sound("win.wav", [523.25, 659.25, 783.99, 1046.5], 0.12)
          make_sound("draw.wav", [440, 349.23], 0.16)

          # Generate PNGs directly with Python's standard library.
          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data)) + kind + data +
                  struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          def make_icon(size):
              rows = bytearray()
              for y in range(size):
                  rows.append(0)
                  for x in range(size):
                      u, v = x / size, y / size
                      color = (15 + int(15 * v), 23, 48 + int(30 * u))

                      # Everything important stays inside the safe central area.
                      if (
                          (abs(u - 0.42) < 0.009 or abs(u - 0.58) < 0.009)
                          and 0.25 < v < 0.75
                      ) or (
                          (abs(v - 0.42) < 0.009 or abs(v - 0.58) < 0.009)
                          and 0.25 < u < 0.75
                      ):
                          color = (91, 104, 151)

                      for cx, cy in [(0.33, 0.33), (0.50, 0.50), (0.67, 0.67)]:
                          dx, dy = u - cx, v - cy
                          if max(abs(dx), abs(dy)) < 0.05:
                              if min(abs(dx - dy), abs(dx + dy)) < 0.015:
                                  color = (77, 231, 219)

                      for cx, cy in [(0.67, 0.33), (0.33, 0.67)]:
                          distance = math.hypot(u - cx, v - cy)
                          if 0.032 < distance < 0.052:
                              color = (248, 128, 184)

                      rows.extend((*color, 255))

              header = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return (
                  b"\x89PNG\r\n\x1a\n" +
                  chunk(b"IHDR", header) +
                  chunk(b"IDAT", zlib.compress(bytes(rows), 9)) +
                  chunk(b"IEND", b"")
              )

          resources = pathlib.Path("android/app/src/main/res")
          for density, size in {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }.items():
              folder = resources / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              (folder / "ic_launcher.png").write_bytes(make_icon(size))

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace(
              'android:label="tic_tac_toe"',
              'android:label="Tic Tac Toe Pro"',
          )
          manifest.write_text(text)

          # Preserve the package ID requested in the original workflow.
          import re
          for filename in ["build.gradle.kts", "build.gradle"]:
              path = pathlib.Path("android/app") / filename
              if path.exists():
                  text = path.read_text()
                  text, count = re.subn(
                      r'applicationId\s*(?:=\s*)?["\'][^"\']+["\']',
                      'applicationId = "cok.aokjfjigg.tic.java"'
                      if filename.endswith(".kts")
                      else 'applicationId "cok.aokjfjigg.tic.java"',
                      text,
                  )
                  if count != 1:
                      raise RuntimeError("Could not set Android application ID")
                  path.write_text(text)
          PY

      - name: Write game engine
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          mkdir -p lib test

          cat > lib/game.dart <<'EOF'
          import 'dart:math';

          const winningLines = <List<int>>[
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6],
          ];

          List<int> winningCells(List<String> board) {
            for (final line in winningLines) {
              if (board[line[0]].isNotEmpty &&
                  board[line[0]] == board[line[1]] &&
                  board[line[1]] == board[line[2]]) {
                return line;
              }
            }
            return [];
          }

          String outcome(List<String> board) {
            final line = winningCells(board);
            if (line.isNotEmpty) return board[line.first];
            return board.contains('') ? '' : 'draw';
          }

          int _minimax(List<String> board, bool maximizing, int depth) {
            final result = outcome(board);
            if (result == 'O') return 10 - depth;
            if (result == 'X') return depth - 10;
            if (result == 'draw') return 0;

            var best = maximizing ? -100 : 100;
            for (var i = 0; i < 9; i++) {
              if (board[i].isNotEmpty) continue;
              board[i] = maximizing ? 'O' : 'X';
              final score = _minimax(board, !maximizing, depth + 1);
              board[i] = '';
              best = maximizing ? max(best, score) : min(best, score);
            }
            return best;
          }

          int chooseMove(List<String> source, String difficulty, Random random) {
            final board = List<String>.from(source);
            if (outcome(board).isNotEmpty) return -1;

            final available = [
              for (var i = 0; i < 9; i++)
                if (board[i].isEmpty) i,
            ];
            if (available.isEmpty) return -1;

            if (difficulty == 'Easy' ||
                (difficulty == 'Medium' && random.nextDouble() < 0.35)) {
              return available[random.nextInt(available.length)];
            }

            var bestScore = -100;
            final bestMoves = <int>[];
            for (final index in available) {
              board[index] = 'O';
              final score = _minimax(board, false, 0);
              board[index] = '';
              if (score > bestScore) {
                bestScore = score;
                bestMoves
                  ..clear()
                  ..add(index);
              } else if (score == bestScore) {
                bestMoves.add(index);
              }
            }
            return bestMoves[random.nextInt(bestMoves.length)];
          }
          EOF

      - name: Write application UI
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:math';

          import 'package:audioplayers/audioplayers.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'game.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final preferences = await SharedPreferences.getInstance();
            runApp(TicTacToeApp(preferences: preferences));
          }

          class TicTacToeApp extends StatefulWidget {
            const TicTacToeApp({super.key, required this.preferences});
            final SharedPreferences preferences;

            @override
            State<TicTacToeApp> createState() => _TicTacToeAppState();
          }

          class _TicTacToeAppState extends State<TicTacToeApp> {
            late bool dark = widget.preferences.getBool('dark') ?? true;

            ThemeData theme(Brightness brightness) {
              final scheme = ColorScheme.fromSeed(
                seedColor: const Color(0xFF7467EF),
                brightness: brightness,
              );
              return ThemeData(
                useMaterial3: true,
                colorScheme: scheme,
                scaffoldBackgroundColor: brightness == Brightness.dark
                    ? const Color(0xFF0D1224)
                    : const Color(0xFFF3F4FC),
              );
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Tic Tac Toe Pro',
                debugShowCheckedModeBanner: false,
                theme: theme(Brightness.light),
                darkTheme: theme(Brightness.dark),
                themeMode: dark ? ThemeMode.dark : ThemeMode.light,
                home: GameScreen(
                  preferences: widget.preferences,
                  dark: dark,
                  toggleTheme: () {
                    setState(() => dark = !dark);
                    unawaited(widget.preferences.setBool('dark', dark));
                  },
                ),
              );
            }
          }

          class GameScreen extends StatefulWidget {
            const GameScreen({
              super.key,
              required this.preferences,
              required this.dark,
              required this.toggleTheme,
            });

            final SharedPreferences preferences;
            final bool dark;
            final VoidCallback toggleTheme;

            @override
            State<GameScreen> createState() => _GameScreenState();
          }

          class _GameScreenState extends State<GameScreen> {
            final _random = Random();
            final _audio = AudioPlayer();
            Timer? _timer;

            List<String> _board = List.filled(9, '');
            String _turn = 'X';
            String _result = '';
            bool _thinking = false;
            bool _disposed = false;

            late bool _ai;
            late bool _sound;
            late String _difficulty;
            int _xScore = 0;
            int _oScore = 0;
            int _draws = 0;

            SharedPreferences get _prefs => widget.preferences;
            String get _scoreKey => _ai ? 'ai_$_difficulty' : 'local';
            Color get _xColor => widget.dark
                ? const Color(0xFF5EEAD4)
                : const Color(0xFF00796B);
            Color get _oColor => widget.dark
                ? const Color(0xFFF9A8D4)
                : const Color(0xFFBE185D);

            @override
            void initState() {
              super.initState();
              _ai = _prefs.getBool('ai') ?? true;
              _sound = _prefs.getBool('sound') ?? true;
              final saved = _prefs.getString('difficulty');
              _difficulty = ['Easy', 'Medium', 'Hard'].contains(saved)
                  ? saved!
                  : 'Hard';
              _loadScores();
            }

            void _loadScores() {
              _xScore = _prefs.getInt('${_scoreKey}_x') ?? 0;
              _oScore = _prefs.getInt('${_scoreKey}_o') ?? 0;
              _draws = _prefs.getInt('${_scoreKey}_draws') ?? 0;
            }

            Future<void> _saveScores() async {
              final key = _scoreKey;
              final x = _xScore;
              final o = _oScore;
              final draws = _draws;
              await _prefs.setInt('${key}_x', x);
              await _prefs.setInt('${key}_o', o);
              await _prefs.setInt('${key}_draws', draws);
            }

            Future<void> _play(String filename) async {
              if (!_sound || _disposed) return;
              try {
                await _audio.stop();
                if (!_disposed && _sound) {
                  await _audio.play(AssetSource(filename));
                }
              } catch (_) {
                // Audio failure must never interrupt a game.
              }
            }

            void _restart() {
              _timer?.cancel();
              setState(() {
                _board = List.filled(9, '');
                _turn = 'X';
                _result = '';
                _thinking = false;
              });
            }

            void _changeMode(bool ai) {
              if (_ai == ai) return;
              _restart();
              setState(() {
                _ai = ai;
                _loadScores();
              });
              unawaited(_prefs.setBool('ai', ai));
            }

            void _changeDifficulty(String? value) {
              if (value == null || value == _difficulty) return;
              _restart();
              setState(() {
                _difficulty = value;
                _loadScores();
              });
              unawaited(_prefs.setString('difficulty', value));
            }

            void _tap(int index) {
              if (_thinking ||
                  _result.isNotEmpty ||
                  _board[index].isNotEmpty ||
                  (_ai && _turn == 'O')) {
                return;
              }
              unawaited(HapticFeedback.selectionClick());
              _move(index);
            }

            void _move(int index) {
              setState(() {
                _board[index] = _turn;
                _result = outcome(_board);
                if (_result == 'X') _xScore++;
                if (_result == 'O') _oScore++;
                if (_result == 'draw') _draws++;
                if (_result.isEmpty) _turn = _turn == 'X' ? 'O' : 'X';
              });

              unawaited(_play(
                _result == 'draw'
                    ? 'draw.wav'
                    : _result.isNotEmpty
                        ? 'win.wav'
                        : 'tap.wav',
              ));

              if (_result.isNotEmpty) {
                unawaited(_saveScores());
              } else if (_ai && _turn == 'O') {
                setState(() => _thinking = true);
                _timer = Timer(const Duration(milliseconds: 480), () {
                  if (!mounted) return;
                  final index = chooseMove(_board, _difficulty, _random);
                  setState(() => _thinking = false);
                  if (index >= 0) _move(index);
                });
              }
            }

            Future<void> _resetScores() async {
              final confirmed = await showDialog<bool>(
                context: context,
                builder: (context) => AlertDialog(
                  title: const Text('Reset scores?'),
                  content: const Text(
                    'This clears scores for the selected mode and difficulty. '
                    'Your current round will also restart.',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(context, false),
                      child: const Text('Cancel'),
                    ),
                    FilledButton(
                      onPressed: () => Navigator.pop(context, true),
                      child: const Text('Reset'),
                    ),
                  ],
                ),
              );
              if (confirmed != true || !mounted) return;
              _restart();
              setState(() {
                _xScore = 0;
                _oScore = 0;
                _draws = 0;
              });
              await _saveScores();
            }

            String get _status {
              if (_result == 'draw') return 'A perfect standoff!';
              if (_result == 'X') return _ai ? 'You won! Nicely played.' : 'Player X wins!';
              if (_result == 'O') return _ai ? 'AI wins. Try again!' : 'Player O wins!';
              if (_thinking) return 'AI is thinking…';
              return _ai ? 'Your move' : 'Player $_turn’s move';
            }

            Widget _scoreCard(String label, int score, Color color, bool active) {
              final scheme = Theme.of(context).colorScheme;
              return Expanded(
                child: AnimatedContainer(
                  duration: const Duration(milliseconds: 200),
                  padding: const EdgeInsets.symmetric(vertical: 16, horizontal: 4),
                  decoration: BoxDecoration(
                    color: active
                        ? color.withValues(alpha: 0.12)
                        : scheme.surfaceContainer,
                    borderRadius: BorderRadius.circular(20),
                    border: Border.all(
                      color: active ? color : Colors.transparent,
                      width: 1.5,
                    ),
                  ),
                  child: Column(
                    children: [
                      Text(
                        '$score',
                        style: TextStyle(
                          color: color,
                          fontSize: 30,
                          fontWeight: FontWeight.w800,
                        ),
                      ),
                      const SizedBox(height: 4),
                      Text(label, textAlign: TextAlign.center),
                    ],
                  ),
                ),
              );
            }

            @override
            void dispose() {
              _disposed = true;
              _timer?.cancel();
              unawaited(_audio.dispose());
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              final highlights = winningCells(_board);

              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(maxWidth: 480),
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.fromLTRB(20, 12, 20, 24),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Row(
                              children: [
                                Container(
                                  padding: const EdgeInsets.all(12),
                                  decoration: BoxDecoration(
                                    gradient: const LinearGradient(
                                      colors: [Color(0xFF7164EE), Color(0xFFB36AE2)],
                                    ),
                                    borderRadius: BorderRadius.circular(18),
                                  ),
                                  child: const Icon(
                                    Icons.grid_3x3_rounded,
                                    color: Colors.white,
                                    size: 30,
                                  ),
                                ),
                                const SizedBox(width: 12),
                                const Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(
                                        'TIC TAC TOE',
                                        style: TextStyle(
                                          fontSize: 19,
                                          fontWeight: FontWeight.w900,
                                          letterSpacing: 1,
                                        ),
                                      ),
                                      Text('Small board. Big brain.'),
                                    ],
                                  ),
                                ),
                                IconButton(
                                  tooltip: _sound ? 'Mute sound' : 'Enable sound',
                                  onPressed: () {
                                    setState(() => _sound = !_sound);
                                    unawaited(_prefs.setBool('sound', _sound));
                                    if (!_sound) unawaited(_audio.stop());
                                  },
                                  icon: Icon(
                                    _sound
                                        ? Icons.volume_up_rounded
                                        : Icons.volume_off_rounded,
                                  ),
                                ),
                                IconButton(
                                  tooltip: 'Switch theme',
                                  onPressed: widget.toggleTheme,
                                  icon: Icon(
                                    widget.dark
                                        ? Icons.light_mode_rounded
                                        : Icons.dark_mode_rounded,
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 28),
                            SegmentedButton<bool>(
                              segments: const [
                                ButtonSegment(
                                  value: true,
                                  label: Text('Vs AI'),
                                  icon: Icon(Icons.smart_toy_outlined),
                                ),
                                ButtonSegment(
                                  value: false,
                                  label: Text('2 Players'),
                                  icon: Icon(Icons.people_outline_rounded),
                                ),
                              ],
                              selected: {_ai},
                              onSelectionChanged: (selection) {
                                _changeMode(selection.first);
                              },
                            ),
                            const SizedBox(height: 14),
                            if (_ai)
                              Row(
                                children: [
                                  const Icon(Icons.tune_rounded, size: 20),
                                  const SizedBox(width: 8),
                                  const Text('Difficulty'),
                                  const Spacer(),
                                  DropdownButton<String>(
                                    value: _difficulty,
                                    underline: const SizedBox.shrink(),
                                    borderRadius: BorderRadius.circular(16),
                                    items: [
                                      for (final level in ['Easy', 'Medium', 'Hard'])
                                        DropdownMenuItem(
                                          value: level,
                                          child: Text(level),
                                        ),
                                    ],
                                    onChanged: _changeDifficulty,
                                  ),
                                ],
                              )
                            else
                              const Padding(
                                padding: EdgeInsets.symmetric(vertical: 14),
                                child: Text(
                                  'Pass the phone and challenge a friend.',
                                  textAlign: TextAlign.center,
                                ),
                              ),
                            const SizedBox(height: 12),
                            Row(
                              children: [
                                _scoreCard(
                                  _ai ? 'You · X' : 'Player X',
                                  _xScore,
                                  _xColor,
                                  _turn == 'X' && _result.isEmpty,
                                ),
                                const SizedBox(width: 10),
                                _scoreCard(
                                  'Draws',
                                  _draws,
                                  scheme.onSurfaceVariant,
                                  false,
                                ),
                                const SizedBox(width: 10),
                                _scoreCard(
                                  _ai ? 'AI · O' : 'Player O',
                                  _oScore,
                                  _oColor,
                                  _turn == 'O' && _result.isEmpty,
                                ),
                              ],
                            ),
                            const SizedBox(height: 24),
                            Semantics(
                              liveRegion: true,
                              child: AnimatedSwitcher(
                                duration: const Duration(milliseconds: 180),
                                child: Text(
                                  _status,
                                  key: ValueKey(_status),
                                  textAlign: TextAlign.center,
                                  style: const TextStyle(
                                    fontSize: 23,
                                    fontWeight: FontWeight.w800,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 6),
                            Text(
                              _result.isNotEmpty
                                  ? 'Start another round to keep the rivalry going.'
                                  : _ai && _difficulty == 'Hard'
                                      ? 'Hard AI never loses. Can you force a draw?'
                                      : 'Connect three in a row to win.',
                              textAlign: TextAlign.center,
                              style: TextStyle(color: scheme.onSurfaceVariant),
                            ),
                            const SizedBox(height: 24),
                            Center(
                              child: ConstrainedBox(
                                constraints: const BoxConstraints(maxWidth: 380),
                                child: AspectRatio(
                                  aspectRatio: 1,
                                  child: GridView.builder(
                                    padding: EdgeInsets.zero,
                                    physics: const NeverScrollableScrollPhysics(),
                                    itemCount: 9,
                                    gridDelegate:
                                        const SliverGridDelegateWithFixedCrossAxisCount(
                                      crossAxisCount: 3,
                                      crossAxisSpacing: 12,
                                      mainAxisSpacing: 12,
                                    ),
                                    itemBuilder: (context, index) {
                                      final mark = _board[index];
                                      final color = mark == 'O' ? _oColor : _xColor;
                                      final winning = highlights.contains(index);
                                      final enabled = mark.isEmpty &&
                                          _result.isEmpty &&
                                          !_thinking;

                                      return Semantics(
                                        button: true,
                                        enabled: enabled,
                                        label: 'Row ${index ~/ 3 + 1}, '
                                            'column ${index % 3 + 1}, '
                                            '${mark.isEmpty ? "empty" : mark}',
                                        child: AnimatedContainer(
                                          duration: const Duration(milliseconds: 250),
                                          decoration: BoxDecoration(
                                            color: winning
                                                ? color.withValues(alpha: 0.18)
                                                : scheme.surfaceContainer,
                                            borderRadius: BorderRadius.circular(22),
                                            border: Border.all(
                                              color: winning
                                                  ? color
                                                  : scheme.outlineVariant
                                                      .withValues(alpha: 0.35),
                                              width: winning ? 2 : 1,
                                            ),
                                          ),
                                          child: Material(
                                            color: Colors.transparent,
                                            child: InkWell(
                                              borderRadius: BorderRadius.circular(22),
                                              onTap: enabled ? () => _tap(index) : null,
                                              child: Center(
                                                child: AnimatedSwitcher(
                                                  duration:
                                                      const Duration(milliseconds: 220),
                                                  transitionBuilder: (child, animation) {
                                                    return ScaleTransition(
                                                      scale: animation,
                                                      child: FadeTransition(
                                                        opacity: animation,
                                                        child: child,
                                                      ),
                                                    );
                                                  },
                                                  child: Text(
                                                    mark,
                                                    key: ValueKey('$index-$mark'),
                                                    style: TextStyle(
                                                      color: color,
                                                      fontSize: 58,
