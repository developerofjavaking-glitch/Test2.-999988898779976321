name: Build Tic Tac Toe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Setup App Package, Sound Effects, Logo, and Source Code
        run: |
          # 1. Initialize Flutter Project with requested Package Name
          flutter create . --org cok.aokjfjigg.tic --project-name java --force

          # 2. Add Audioplayers dependency to pubspec.yaml
          flutter pub add audioplayers

          # 3. Create sound effects inside assets/
          mkdir -p assets
          
          # Generate a short 44100Hz WAV click sound byte
          python3 -c "
          import wave, struct, math
          def gen_wav(filename, freq, duration):
              sample_rate = 44100
              n_samples = int(sample_rate * duration)
              with wave.open(filename, 'w') as f:
                  f.setnchannels(1)
                  f.setsampwidth(2)
                  f.setframerate(sample_rate)
                  for i in range(n_samples):
                      t = i / sample_rate
                      value = int(16000 * math.sin(2 * math.pi * freq * t))
                      f.writeframes(struct.pack('<h', value))

          gen_wav('assets/tap.wav', 600, 0.08)
          gen_wav('assets/win.wav', 880, 0.3)
          "

          # 4. Enable assets in pubspec.yaml
          sed -i '/flutter:/a \  assets:\n    - assets/tap.wav\n    - assets/win.wav' pubspec.yaml

          # 5. Overwrite lib/main.dart with sound effects and custom logo design
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:audioplayers/audioplayers.dart';

          void main() => runApp(const TicTacToeApp());

          class TicTacToeApp extends StatelessWidget {
            const TicTacToeApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Tic Tac Toe Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  primarySwatch: Colors.deepPurple,
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                ),
                home: const TicTacToeScreen(),
              );
            }
          }

          class TicTacToeScreen extends StatefulWidget {
            const TicTacToeScreen({super.key});

            @override
            State<TicTacToeScreen> createState() => _TicTacToeScreenState();
          }

          class _TicTacToeScreenState extends State<TicTacToeScreen> {
            List<String> board = List.filled(9, '');
            String winner = '';
            bool isTurnX = true;
            final AudioPlayer _audioPlayer = AudioPlayer();

            void _playSound(String assetName) async {
              try {
                await _audioPlayer.stop();
                await _audioPlayer.play(AssetSource(assetName));
              } catch (_) {}
            }

            void _handleTap(int index) {
              if (board[index] == '' && winner == '') {
                _playSound('tap.wav');
                setState(() {
                  board[index] = isTurnX ? 'X' : 'O';
                  isTurnX = !isTurnX;
                  winner = _checkWinner();
                  if (winner.isNotEmpty) {
                    _playSound('win.wav');
                  }
                });
              }
            }

            String _checkWinner() {
              const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
              ];

              for (var combo in winningCombinations) {
                String a = board[combo[0]];
                String b = board[combo[1]];
                String c = board[combo[2]];
                if (a != '' && a == b && b == c) {
                  return '$a Wins!';
                }
              }

              if (!board.contains('')) {
                return 'It\'s a Draw!';
              }
              return '';
            }

            void _resetGame() {
              _playSound('tap.wav');
              setState(() {
                board = List.filled(9, '');
                isTurnX = true;
                winner = '';
              });
            }

            @override
            void dispose() {
              _audioPlayer.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      // Modern Logo / Header
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          gradient: const LinearGradient(
                            colors: [Colors.cyanAccent, Colors.purpleAccent],
                          ),
                          boxShadow: [
                            BoxShadow(
                              color: Colors.purpleAccent.withOpacity(0.5),
                              blurRadius: 20,
                              spreadRadius: 2,
                            ),
                          ],
                        ),
                        child: const Icon(
                          Icons.grid_3x3_rounded,
                          size: 50,
                          color: Colors.black,
                        ),
                      ),
                      const SizedBox(height: 15),
                      const Text(
                        'TIC TAC TOE',
                        style: TextStyle(
                          fontSize: 28,
                          fontWeight: FontWeight.bold,
                          letterSpacing: 3,
                          color: Colors.white,
                        ),
                      ),
                      const SizedBox(height: 25),
                      Text(
                        winner.isEmpty ? 'Player Turn: ${isTurnX ? "X" : "O"}' : winner,
                        style: TextStyle(
                          fontSize: 22,
                          fontWeight: FontWeight.w600,
                          color: winner.contains('Wins') ? Colors.greenAccent : Colors.cyanAccent,
                        ),
                      ),
                      const SizedBox(height: 30),
                      Center(
                        child: SizedBox(
                          width: 320,
                          height: 320,
                          child: GridView.builder(
                            physics: const NeverScrollableScrollPhysics(),
                            itemCount: 9,
                            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                              crossAxisCount: 3,
                              crossAxisSpacing: 8,
                              mainAxisSpacing: 8,
                            ),
                            itemBuilder: (context, index) {
                              return GestureDetector(
                                onTap: () => _handleTap(index),
                                child: AnimatedContainer(
                                  duration: const Duration(milliseconds: 200),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF1E293B),
                                    borderRadius: BorderRadius.circular(12),
                                    border: Border.all(
                                      color: Colors.white12,
                                      width: 1.5,
                                    ),
                                  ),
                                  child: Center(
                                    child: Text(
                                      board[index],
                                      style: TextStyle(
                                        fontSize: 52,
                                        fontWeight: FontWeight.bold,
                                        color: board[index] == 'X'
                                            ? Colors.cyanAccent
                                            : Colors.pinkAccent,
                                      ),
                                    ),
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ),
                      const SizedBox(height: 35),
                      ElevatedButton.icon(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.purpleAccent,
                          padding: const EdgeInsets.symmetric(horizontal: 32, vertical: 14),
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(30),
                          ),
                        ),
                        onPressed: _resetGame,
                        icon: const Icon(Icons.refresh, color: Colors.white),
                        label: const Text(
                          'Restart Game',
                          style: TextStyle(fontSize: 18, color: Colors.white, fontWeight: FontWeight.bold),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 6. Resolve dependencies & build release APK
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
