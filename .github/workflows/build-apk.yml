      - name: Write automated tests
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          cat > test/game_test.dart <<'EOF'
          import 'dart:math';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:tic_tac_toe/game.dart';

          void main() {
            test('Detects every winning line', () {
              for (final line in winningLines) {
                final board = List.filled(9, '');
                for (final cell in line) {
                  board[cell] = 'X';
                }
                expect(outcome(board), 'X');
                expect(winningCells(board), line);
              }
            });

            test('Detects a draw', () {
              expect(
                outcome(['X', 'O', 'X', 'X', 'O', 'O', 'O', 'X', 'X']),
                'draw',
              );
            });

            test('Hard AI blocks an immediate loss', () {
              final board = ['X', 'X', '', '', 'O', '', '', '', ''];
              expect(chooseMove(board, 'Hard', Random(1)), 2);
              expect(board[2], '');
            });

            test('Hard AI takes a winning move', () {
              final board = ['O', 'O', '', 'X', 'X', '', 'X', '', ''];
              expect(chooseMove(board, 'Hard', Random(1)), 2);
            });

            test('No move is returned for a completed game', () {
              expect(
                chooseMove(
                  ['X', 'X', 'X', 'O', 'O', '', '', '', ''],
                  'Hard',
                  Random(1),
                ),
                -1,
              );
            });

            test('Hard AI cannot lose against any human continuation', () {
              void explore(List<String> board, bool humanTurn) {
                final result = outcome(board);
                expect(result, isNot('X'));
                if (result.isNotEmpty) return;

                if (humanTurn) {
                  for (var i = 0; i < 9; i++) {
                    if (board[i].isNotEmpty) continue;
                    final next = List<String>.from(board)..[i] = 'X';
                    explore(next, false);
                  }
                } else {
                  final move = chooseMove(board, 'Hard', Random(42));
                  final next = List<String>.from(board)..[move] = 'O';
                  explore(next, true);
                }
              }

              explore(List.filled(9, ''), true);
            });
          }
          EOF

          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:tic_tac_toe/main.dart';

          void main() {
            testWidgets('Game renders and supports theme changes', (tester) async {
              SharedPreferences.setMockInitialValues({});
              final preferences = await SharedPreferences.getInstance();

              await tester.pumpWidget(
                TicTacToeApp(preferences: preferences),
              );
              await tester.pumpAndSettle();

              expect(find.text('TIC TAC TOE'), findsOneWidget);
              expect(find.text('Your move'), findsOneWidget);
              expect(find.text('Vs AI'), findsOneWidget);

              await tester.tap(find.byTooltip('Switch theme'));
              await tester.pumpAndSettle();
              expect(preferences.getBool('dark'), false);

              await tester.pumpWidget(const SizedBox.shrink());
              await tester.pumpAndSettle();
            });
          }
          EOF

      - name: Install dependencies
        working-directory: generated_app
        run: |
          set -euo pipefail
          flutter pub get

      - name: Format, analyze, and test
        working-directory: generated_app
        run: |
          set -euo pipefail
          dart format lib test
          flutter analyze
          flutter test

      - name: Build release APK
        working-directory: generated_app
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --build-name=1.0.0 \
            --build-number="${{ github.run_number }}"

      - name: Prepare APK and checksum
        run: |
          set -euo pipefail

          mkdir -p dist

          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" \
            dist/tic-tac-toe-pro.apk

          test -s dist/tic-tac-toe-pro.apk
          unzip -t dist/tic-tac-toe-pro.apk > /dev/null

